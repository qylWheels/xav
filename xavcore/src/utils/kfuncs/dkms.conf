# dkms.conf for the xavcore_kfuncs out-of-tree kernel module.

PACKAGE_NAME="xavcore-kfuncs"
PACKAGE_VERSION="0.1.0"

# Build the module against the currently running kernel source tree. The
# `copy_only` variant is handled separately in the CMakeLists if ever needed.
MAKE[0]="make -C \"${kernel_source_dir}\" M=\"${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build\" modules"
CLEAN="make -C \"${kernel_source_dir}\" M=\"${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build\" clean"

# One externally visible .ko produced by the build above.
BUILT_MODULE_NAME[0]="xavcore_kfuncs"

# Where inside /lib/modules/<kernel>/ the .ko is installed.
DEST_MODULE_LOCATION[0]="/extra"

# Strip debug info/symbols from the installed .ko by default.
STRIP[0]="strip"

# Rebuild this module automatically whenever a new kernel is installed or
# removed.
AUTOINSTALL="yes"
